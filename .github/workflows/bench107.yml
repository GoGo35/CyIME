name: 107 Debug pair (timed)
on:
  push:
    branches: [bench107-pair-run]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASE: 686c269852f1fac76b37576aec9b3c451ddad88e
      FORK: fd6f59d9a4c4587f47cd1d0f2f82d0421ef9c87f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK and tools
        id: prepare
        run: |
          sdkmanager 'ndk;29.0.14206865' 'build-tools;36.0.0' 'platforms;android-36' 'cmake;3.22.1'
          cp scripts/ci/time-debug107.py "$RUNNER_TEMP/time-debug107.py"
          git cat-file -e "$BASE^{commit}"
          git cat-file -e "$FORK^{commit}"
      - name: Check out A (official source)
        run: git switch --detach "$BASE"
      - name: Gradle A and verify APK
        run: python3 "$RUNNER_TEMP/time-debug107.py" A-base "$RUNNER_TEMP/pair107"
      - name: Check out B (feature source)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: git switch --detach "$FORK"
      - name: Gradle B and verify APK
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          test "$(git rev-parse HEAD)" = "$FORK"
          python3 "$RUNNER_TEMP/time-debug107.py" B-fork "$RUNNER_TEMP/pair107"
      - name: Publish measured Gradle times
        id: times
        if: always()
        shell: python
        run: |
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'pair107'
          parts = []
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as md:
              print('| Source | Commit | Gradle seconds | APK verified |', '|---|---|---:|---|', sep='\n', file=md)
              for side in ('A-base', 'B-fork'):
                  path = root / (side + '.json')
                  rec = json.loads(path.read_text()) if path.exists() else {}
                  elapsed = rec.get('gradle_seconds', 'n/a')
                  verified = rec.get('verified', False)
                  print(f"| {side} | {rec.get('commit', '-')[:9]} | {elapsed} | {verified} |", file=md)
                  parts.append(side[0] + (f'{elapsed}s' if verified else '-incomplete'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              print('label=' + '-'.join(parts), file=fh)
      - name: Upload APKs and timing records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CyIME-107-debug-pair-arm64-${{ steps.times.outputs.label }}
          path: ${{ runner.temp }}/pair107/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
